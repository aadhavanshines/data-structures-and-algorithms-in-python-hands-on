# Runs the tests on Linux, macOS and Windows with each Python version the
# book was tested with. The results are public on the Actions tab.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the packages
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -v
      - name: Run a benchmark
        run: python benchmarks/append.py --quick
