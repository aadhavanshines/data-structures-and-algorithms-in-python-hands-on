# Runs every program and every chapter notebook from the book on Linux,
# macOS and Windows, with each Python version the book was tested with, and
# compares the output with the .out files. The results are public on the
# repository's Actions tab.
name: Check every listing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  listings:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the packages the book uses
        run: python -m pip install -r requirements.txt
      - name: Check every listing
        run: python tests/run_listings.py
      - name: Run every notebook and compare
        run: python tests/check_notebooks.py
